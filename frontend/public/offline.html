<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - MATSANDATAMA</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8fafc; color: #0f172a; text-align: center; padding: 24px;
      }
      .card { max-width: 360px; }
      img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #006837; }
      p { font-size: 14px; color: #475569; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #006837; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Logo" />
      <h1>Tidak Ada Koneksi</h1>
      <p>Anda sedang offline. Periksa koneksi internet lalu coba lagi untuk mengakses Super Apps MATSANDATAMA.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
