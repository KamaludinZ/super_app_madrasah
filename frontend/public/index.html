        <style>
            /* Force hide Emergent badge if injected dynamically */
            #emergent-badge,
            a[href*="emergent.sh"],
            a[href*="utm_source=emergent-badge"] {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }

            /* Instant Splash Screen - Shows immediately before React loads */
            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                opacity: 1;
                transition: opacity 0.5s ease-out;
            }

            #splash-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .splash-content {
                text-align: center;
                padding: 2rem;
            }

            .splash-logo {
                width: 120px;
                height: 120px;
                margin: 0 auto 1.5rem;
                background: white;
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                animation: pulse 2s ease-in-out infinite;
            }

            .splash-logo img {
                max-width: 80%;
                max-height: 80%;
                object-fit: contain;
            }

            .splash-title {
                font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
                font-size: 1.5rem;
                font-weight: 700;
                color: #1e293b;
                margin-bottom: 0.5rem;
            }

            .splash-subtitle {
                font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
                font-size: 0.95rem;
                color: #64748b;
                margin-bottom: 2rem;
            }

            .splash-spinner {
                width: 40px;
                height: 40px;
                margin: 0 auto;
                border: 4px solid #e2e8f0;
                border-top-color: #059669;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            .splash-dots {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-top: 1rem;
            }

            .splash-dot {
                width: 8px;
                height: 8px;
                background: #059669;
                border-radius: 50%;
                animation: bounce 1.4s ease-in-out infinite;
            }

            .splash-dot:nth-child(1) { animation-delay: 0s; }
            .splash-dot:nth-child(2) { animation-delay: 0.2s; }
            .splash-dot:nth-child(3) { animation-delay: 0.4s; }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.05); opacity: 0.9; }
            }

            @keyframes bounce {
                0%, 80%, 100% { transform: translateY(0); }
                40% { transform: translateY(-12px); }
            }
        </style>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
            // Remove Emergent badge if dynamically injected
            window.addEventListener('DOMContentLoaded', function() {
                function removeEmergentBadge() {
                    const badge = document.getElementById('emergent-badge');
                    if (badge) {
                        badge.remove();
                    }
                    // Also check for any emergent links
                    document.querySelectorAll('a[href*="emergent.sh"]').forEach(el => el.remove());
                }
                removeEmergentBadge();
                // Check again after a short delay in case it's injected later
                setTimeout(removeEmergentBadge, 500);
                setTimeout(removeEmergentBadge, 1000);
                setTimeout(removeEmergentBadge, 2000);
            });
        </script>
