server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas ukuran unggahan (Excel impor, foto, berkas siswa, paket soal). Bawaan nginx hanya 1 MB: berkas lebih besar
    # ditolak 413 sebelum sampai backend dan browser sering hanya melapor "Failed to fetch". Backend membatasi sendiri
    # per jenis berkas (maks. 30 MB untuk paket), jadi di sini cukup di atas batas terbesar itu.
    client_max_body_size 32m;

    # Healthcheck container (Dockerfile HEALTHCHECK, docker compose, Coolify): 200 bila nginx hidup dan hasil build
    # React ada. Tidak bergantung pada backend agar frontend tidak ikut dianggap rusak saat backend redeploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        if (!-f $document_root/index.html) {
            return 503 "build frontend tidak ditemukan\n";
        }
        return 200 "ok\n";
    }

    # Proxy semua request /api ke backend.
    # Set env BACKEND_UPSTREAM, contoh: http://backend:8000/api/ (service compose) atau https://api.domain-anda.com/api/
    # Penting: gunakan URL yang bisa di-resolve dari container frontend.
    # BACKEND_ORIGIN, BACKEND_PATH & NGINX_LOCAL_RESOLVERS diisi docker/15-superapp-upstream.envsh dari BACKEND_UPSTREAM.
    # proxy_pass memakai variabel sehingga nama host backend di-resolve saat request: nginx tetap start (dan healthcheck
    # tetap sehat) walau backend belum bisa dijangkau — /api/ sementara membalas 502.
    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 5s;
        set $backend_origin "${BACKEND_ORIGIN}";
        rewrite ^/api/(.*)$ ${BACKEND_PATH}$1 break;
        proxy_pass $backend_origin;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # PWA: jangan cache service worker agar update langsung diterapkan
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # React Router - fallback ke index.html untuk semua route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
