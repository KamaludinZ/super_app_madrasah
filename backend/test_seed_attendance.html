<!DOCTYPE html>
<html>
<head>
    <title>Test Seed Attendance Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test Seed Attendance Data</h1>

    <div class="section">
        <h3>Instructions</h3>
        <p>1. Login as an admin user in the main app</p>
        <p>2. Open browser DevTools (F12) and go to Console</p>
        <p>3. Type: <code>localStorage.getItem('token')</code></p>
        <p>4. Copy the token (without quotes) and paste it below</p>
    </div>

    <div class="section">
        <label>Admin Token:</label>
        <input type="text" id="token" placeholder="Paste your admin token here" />
        <br><br>
        <button onclick="seedData()">Seed Attendance Data</button>
    </div>

    <div id="result"></div>

    <script>
        async function seedData() {
            const token = document.getElementById('token').value.trim();
            const resultDiv = document.getElementById('result');

            if (!token) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Please enter an admin token';
                return;
            }

            resultDiv.textContent = 'Seeding data, please wait...';
            resultDiv.className = '';

            try {
                const response = await fetch('http://localhost:8000/api/seed-attendance-data', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = 'ERROR:\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Network Error:\n\n' + error.message;
            }
        }
    </script>
</body>
</html>
