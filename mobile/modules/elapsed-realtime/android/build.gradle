// Modul native lokal: jam monoton SystemClock.elapsedRealtime() untuk bukti waktu jurnal offline.
// Pola Expo SDK 57: expo-module-gradle-plugin mengatur compileSdk/minSdk/Kotlin sama dengan modul Expo lain.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'id.sch.mtsn2kotamalang.superapps.elapsedrealtime'
version = '1.0.0'

android {
  namespace "id.sch.mtsn2kotamalang.superapps.elapsedrealtime"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}
