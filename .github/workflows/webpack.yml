name: Frontend Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 sudah EOL dan react-router-dom v7 butuh Node >= 20
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Proyek frontend ada di folder frontend/ dan dibangun dengan CRA + craco
    - name: Install & build
      working-directory: frontend
      env:
        # CRA memperlakukan warning ESLint sebagai error jika CI=true;
        # masih banyak warning lama (react-hooks/exhaustive-deps) di kode.
        CI: false
      run: |
        npm ci --legacy-peer-deps
        npm run build
